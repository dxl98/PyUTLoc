[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyUTLoc"
version = "2.0.0rc1"
description = "Validated normalization of heterogeneous coordinate representations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Xiaoliang Dai"}]
dependencies = ["pyproj>=3.6", "pygeodesy", "mgrs", "utm", "openlocationcode", "geohash2", "maidenhead"]

[project.optional-dependencies]
geocoding = ["geopy>=2.4"]
test = ["pytest", "numpy", "pandas", "scipy", "psutil", "matplotlib", "lat-lon-parser"]

[project.scripts]
pyutloc = "pyutloc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
